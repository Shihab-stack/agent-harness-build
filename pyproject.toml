[project]
name = "agent-harness-build"
version = "0.1.0"
description = "A local-first personal assistant with tools and MCP integrations"
readme = "README.md"
authors = [
    { name = "Shihab-stack", email = "sheikh.shihab.uddin@g.bracu.ac.bd" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-telegram-bot>=22.5,<23",
    "sse-starlette>=3.5.0",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent-harness-build = "agent_herness_build.cli:main"
agent-harness-telegram = "agent_herness_build.telegram_bot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_herness_build"
